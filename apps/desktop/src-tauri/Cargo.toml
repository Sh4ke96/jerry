[package]
name = "jerry-desktop"
version = "0.1.0"
description = "JERRY Desktop: the JERRY dashboard in its own window, with a tray icon and notifications"
edition = "2021"
publish = false

[lib]
name = "jerry_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "=2.5.5"
tauri-plugin-notification = "=2.8.0"
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-dialog = "=2.8.4"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
ureq = { version = "=3.5.1", default-features = false }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
